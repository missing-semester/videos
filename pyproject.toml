[project]
name = "msv"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
msv-sync-audio = "msv.cli.sync.audio:main"
msv-sync-video = "msv.cli.sync.video:main"
msv-normalize-sbv = "msv.cli.normalize_sbv:main"
msv-render-lecture = "msv.cli.lecture:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "ruff>=0.14.13",
]

[tool.ruff]
line-length = 120
lint.select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # ruff-specific rules
    "RUF",
]

[tool.mypy]
strict = true
